---
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '23 7 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Autobuild doesn't know about mage - build with the project's own build instead.
          build-mode: manual
          # queries: security-extended,security-and-quality

      # CodeQL's Go tracer doesn't see the compiler invocations mage makes, so build with plain
      # `go build`. The generated API code and the web/dist placeholder are committed, so this
      # needs neither mage's tools nor Node.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
