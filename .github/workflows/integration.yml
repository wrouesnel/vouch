---
name: Build and Test
"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  # Tag builds run this via release.yml.
  workflow_call:
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check style
        run: go run mage.go style

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint
        run: go run mage.go lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go run mage.go test
      - name: Merge Coverage Files
        run: go run mage.go coverage
      - name: Coveralls
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: .cover.out

  # Runs the directory and workflow tests against a real Samba AD DC (test/samba).
  samba-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start Samba AD DC
        run: test/samba/start.sh
      - name: Samba integration tests
        env:
          VOUCH_SAMBA_URL: ldap://127.0.0.1:10389
        run: go test -count=1 -v -run Samba ./pkg/directory/
      - name: Samba logs
        if: failure()
        run: podman logs --tail 200 vouch-samba-test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Only needed if the project has a web interface under web/.
      - name: Setup Node
        if: hashFiles('web/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: go run mage.go binary

  # Every branch and PR builds the image, so a broken Dockerfile fails CI. Pushes to main also
  # publish it. Tags are skipped here: release.yml builds and publishes them.
  container:
    if: github.ref_type != 'tag'
    needs: [style, lint, test, samba-integration, build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
