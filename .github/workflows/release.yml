---
name: Release
on:
  push:
    tags:
      - v*

jobs:
  integration:
    # integration.yml's container job asks for packages: write (it's skipped for tags, but
    # a called workflow can't ask for more than its caller grants).
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/integration.yml

  container:
    needs: integration
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      push: true

  generate-release-matrix:
    runs-on: ubuntu-latest
    outputs:
      release-matrix: ${{ steps.generate-matrix.outputs.release-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Release Matrix
        id: generate-matrix
        run: go run mage.go githubReleaseMatrix

  release-build:
    runs-on: ubuntu-latest
    needs:
      - integration
      - generate-release-matrix
    strategy:
      matrix:
        osarch: ${{ fromJson(needs.generate-release-matrix.outputs.release-matrix) }}
      max-parallel: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags -f

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Only needed if the project has a web interface under web/.
      - name: Setup Node
        if: hashFiles('web/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Release Build
        run: go run mage.go release ${{ matrix.osarch }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ strategy.job-index }}
          path: release/*

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # Publish the release only once the images it refers to are published too.
    needs:
      - release-build
      - container
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A tag with a suffix, such as v0.2.0-rc.1, is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*
